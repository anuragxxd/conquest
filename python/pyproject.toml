[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snakemake-executor-plugin-conquest-tes"
version = "0.1.0"
description = "Conquest-owned Snakemake executor plugin for TES execution"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34,<2",
  "py-tes>=0.4.2,<0.5",
  "snakemake-interface-common>=1.20,<2",
  "snakemake-interface-executor-plugins>=9.3,<10",
]

[tool.setuptools]
packages = ["snakemake_executor_plugin_conquest_tes"]
