name: images

# Builds and publishes every Conquest image to Docker Hub.
#
#   push to master  -> :latest  (+ :sha-<short>)
#   push tag vX.Y.Z -> :X.Y.Z   (+ :X.Y, :X, :latest)
#
# Architectures
# -------------
# The server, WDL and Snakemake images build from public Debian/Alpine bases
# and are published as linux/amd64 + linux/arm64 manifest lists.
#
# The Nextflow runners are amd64-only. They layer the conquest binary onto a
# curated Nextflow runtime base that is itself published for linux/amd64 only:
#
#   $ docker buildx imagetools inspect \
#       $NXF_BASE_REGISTRY/conquest-runner:$NXF_RUNTIME_TAG_PREFIX-nf-24.10.4
#     Platform: linux/amd64
#
# Requesting arm64 for those would fail at the FROM, so the matrix pins them
# to amd64 rather than failing the build. To make them multi-arch, the curated
# base images must first be rebuilt as manifest lists; then drop the override
# below and they will follow the default platforms.

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEFAULT_PLATFORMS: linux/amd64,linux/arm64
  # Curated Nextflow runtime bases. Override via repo variables if they move.
  NXF_BASE_REGISTRY: ${{ vars.NXF_BASE_REGISTRY || 'harbor.pacificanalytics.com/pacificanalytics' }}
  NXF_RUNTIME_TAG_PREFIX: ${{ vars.NXF_RUNTIME_TAG_PREFIX || 'cleanup-20260328011600' }}
  NXF_PLUGINS_ALLOWED: nf-ga4gh,nf-amazon,nf-schema,nf-core-utils,nf-fgbio,nf-prov

jobs:
  # ---------------------------------------------------------------------------
  # Multi-arch images: public bases, no private registry needed.
  # ---------------------------------------------------------------------------
  multiarch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conquest
            file: docker/server/Dockerfile
            build_args: ""
          - name: conquest-wdl-runner
            file: docker/wdl-runner/Dockerfile
            build_args: ""
          - name: conquest-smk-9.17.3-runner
            file: docker/smk-runner/Dockerfile
            build_args: |
              SNAKEMAKE_VERSION=9.17.3
          - name: conquest-smk-7.32.4-runner
            file: docker/smk-runner/v7.Dockerfile
            build_args: |
              SNAKEMAKE_VERSION=7.32.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=sha,prefix=sha-,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ env.DEFAULT_PLATFORMS }}
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Nextflow runners: amd64 only (curated base is amd64-only), and the base
  # lives in a private registry, so this job is skipped unless HARBOR_USERNAME
  # is configured.
  # ---------------------------------------------------------------------------
  nextflow-runners:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nxf_version: ["24.10.4", "25.04.3", "25.10.2", "25.10.4"]
    steps:
      - name: Check for private registry credentials
        id: gate
        run: |
          if [ -n "${{ secrets.HARBOR_USERNAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HARBOR_USERNAME not set - skipping Nextflow runner images." \
                 "The curated NXF runtime base is not publicly pullable."
          fi

      - name: Check out repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to the curated base registry
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY || 'harbor.pacificanalytics.com' }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: steps.gate.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/conquest-nf-${{ matrix.nxf_version }}-runner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=sha,prefix=sha-,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push (linux/amd64 only)
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nf-runner/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NXF_BASE_IMAGE=${{ env.NXF_BASE_REGISTRY }}/conquest-runner:${{ env.NXF_RUNTIME_TAG_PREFIX }}-nf-${{ matrix.nxf_version }}
            NXF_PLUGINS_ALLOWED=${{ env.NXF_PLUGINS_ALLOWED }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nf-${{ matrix.nxf_version }}
          cache-to: type=gha,mode=max,scope=nf-${{ matrix.nxf_version }}
          provenance: false
