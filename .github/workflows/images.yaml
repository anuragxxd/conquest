name: images

# Builds and publishes every Conquest image to Docker Hub.
#
#   push to master  -> :latest  (+ :sha-<short>)
#   push tag vX.Y.Z -> :X.Y.Z   (+ :X.Y, :X, :latest)
#
# Job graph
# ---------
#   changes ──> nf-runtime ──> nextflow-runners
#           └─> multiarch (independent)
#
# The nf-*-runner images are nothing but the conquest binary layered onto a
# curated Nextflow runtime base, so they must never be built against a base
# that failed or is stale. `needs` enforces that ordering.
#
# The runtime bases carry the JVM, a pinned Nextflow and its plugins. They are
# slow to build (package installs, network downloads, and a JVM running under
# QEMU for arm64) and change only when a Nextflow or plugin pin moves, so the
# `changes` job gates them on their own sources. When skipped, the runners
# still run and reuse the published bases.
#
# Architectures
# -------------
# Everything is linux/amd64 + linux/arm64. The Nextflow bases were previously
# amd64-only because the image had no source anywhere and could not be rebuilt;
# docker/nf-runtime/Dockerfile now reconstructs it, and every component
# (amazoncorretto, the Nextflow launcher, JAR plugins) is arch-portable.
#
# Secrets live in the `master` environment, which is restricted to protected
# branches, so no unprotected ref can read them or publish.

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      force_runtime:
        description: "Rebuild the Nextflow runtime bases even if unchanged"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PLATFORMS: linux/amd64,linux/arm64
  NXF_PLUGINS_ALLOWED: nf-ga4gh,nf-amazon,nf-schema,nf-core-utils,nf-fgbio,nf-prov

jobs:
  # ---------------------------------------------------------------------------
  # Decide whether the runtime bases need rebuilding.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      nf_runtime: ${{ steps.filter.outputs.nf_runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect runtime source changes
        id: filter
        env:
          FORCE: ${{ github.event.inputs.force_runtime }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          emit() { echo "nf_runtime=$1" >> "$GITHUB_OUTPUT"; echo "nf_runtime=$1"; }

          # Manual runs rebuild only when explicitly asked.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$FORCE" = "true" ] && emit true || emit false
            exit 0
          fi

          # Version tags reuse the existing bases: the runtime images are tagged
          # by Nextflow version, not by the project's semver, so a release tag
          # implies nothing about them.
          if [ "$EVENT" = "push" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            emit false; exit 0
          fi

          # New branch or force-push with no usable base commit: rebuild.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            emit true; exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            emit true; exit 0
          fi

          if git diff --name-only "$BEFORE" "$SHA" \
              | grep -qE '^docker/nf-runtime/|^\.github/workflows/images\.yaml$'; then
            emit true
          else
            emit false
          fi

  # ---------------------------------------------------------------------------
  # Curated Nextflow runtime bases. Must publish before the runners build.
  # ---------------------------------------------------------------------------
  nf-runtime:
    needs: changes
    if: needs.changes.outputs.nf_runtime == 'true'
    environment: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nxf_version: "24.10.4"
            plugins: "nf-ga4gh@1.3.0 nf-amazon@2.9.0"
          - nxf_version: "25.04.3"
            plugins: "nf-ga4gh@1.3.0 nf-amazon@2.9.0"
          - nxf_version: "25.10.2"
            plugins: "nf-ga4gh@1.4.0 nf-amazon@2.9.0"
          - nxf_version: "25.10.4"
            plugins: "nf-ga4gh@1.4.0 nf-amazon@2.9.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push runtime base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nf-runtime/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            NXF_VER=${{ matrix.nxf_version }}
            NXF_PREINSTALL_PLUGINS=${{ matrix.plugins }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/conquest-nf-runtime:nf-${{ matrix.nxf_version }}
          cache-from: type=gha,scope=nf-runtime-${{ matrix.nxf_version }}
          cache-to: type=gha,mode=max,scope=nf-runtime-${{ matrix.nxf_version }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Nextflow runners: the conquest binary on top of the runtime base.
  # ---------------------------------------------------------------------------
  nextflow-runners:
    needs: [changes, nf-runtime]
    # Proceed when the runtime built, or when it was skipped because nothing
    # about it changed. Never proceed if it actually failed.
    if: ${{ !cancelled() && (needs.nf-runtime.result == 'success' || needs.nf-runtime.result == 'skipped') }}
    environment: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nxf_version: ["24.10.4", "25.04.3", "25.10.2", "25.10.4"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/conquest-nf-${{ matrix.nxf_version }}-runner
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=sha,prefix=sha-,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nf-runner/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            NXF_BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/conquest-nf-runtime:nf-${{ matrix.nxf_version }}
            NXF_PLUGINS_ALLOWED=${{ env.NXF_PLUGINS_ALLOWED }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nf-${{ matrix.nxf_version }}
          cache-to: type=gha,mode=max,scope=nf-${{ matrix.nxf_version }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Server, WDL and Snakemake images: public bases, no dependency on the above.
  # ---------------------------------------------------------------------------
  multiarch:
    environment: master
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: conquest
            file: docker/server/Dockerfile
            build_args: ""
          - name: conquest-wdl-runner
            file: docker/wdl-runner/Dockerfile
            build_args: ""
          - name: conquest-smk-9.17.3-runner
            file: docker/smk-runner/Dockerfile
            build_args: |
              SNAKEMAKE_VERSION=9.17.3
          - name: conquest-smk-7.32.4-runner
            file: docker/smk-runner/v7.Dockerfile
            build_args: |
              SNAKEMAKE_VERSION=7.32.4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=sha,prefix=sha-,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
