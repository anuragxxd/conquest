name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  python-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same Python as the Snakemake runner image (docker/smk-runner).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Snakemake executor and miniwdl plugins
        run: pip install ./python ./python/miniwdl_conquest_tes pytest

      - name: pytest
        run: pytest -q python/tests python/miniwdl_conquest_tes/tests
