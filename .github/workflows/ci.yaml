name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# A new commit on a pull request cancels the pull request's runs in progress;
# pushes to master each get their own group, so none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  python-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same Python as the Snakemake runner image (docker/smk-runner).
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the Snakemake executor and miniwdl plugins
        run: pip install ./python ./python/miniwdl_conquest_tes pytest

      - name: pytest
        run: pytest -q python/tests python/miniwdl_conquest_tes/tests

  # The one check to require in branch protection: it fails if any job above
  # failed or was cancelled, so adding a job needs no change to the protection
  # rules, only to `needs`
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-test, python-plugin]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              exit 1
            fi
          done
