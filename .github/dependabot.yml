version: 2
updates:
  # Actions in the workflows are pinned to commit SHAs; this keeps the pins
  # (and their version comments) up to date, in one grouped pull request
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: ci
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Base images of the Dockerfiles in `docker/` (images selected through a
  # build argument, such as the Nextflow runtime's `CORRETTO_TAG`, are not
  # updated)
  - package-ecosystem: docker
    directories: ["/docker/*"]
    commit-message:
      prefix: build
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    commit-message:
      prefix: build
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns: ["*"]
  # The Snakemake executor and miniwdl plugins
  - package-ecosystem: pip
    directories: ["/python", "/python/miniwdl_conquest_tes"]
    commit-message:
      prefix: build
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ["*"]
