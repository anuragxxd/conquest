conquest:
  appname: conquest

  image:
    repository: registry.example.com/conquest/conquest
    tag: latest
    pullPolicy: Always

  runnerImage:
    repository: registry.example.com/conquest/conquest-nf-24.10.4-runner
    tag: latest

  wdlRunnerImage:
    repository: registry.example.com/conquest/conquest-wdl-runner
    tag: latest

  snakemakeRunnerImage:
    repository: registry.example.com/conquest/conquest-smk-9.17.3-runner
    tag: latest

  snakemakeTaskImage:
    repository: registry.example.com/conquest/conquest-smk-9.17.3-runner
    tag: latest

  snakemakeDefaultJobs: 32
  snakemakeDefaultDiskMB: 8192
  runnerEphemeralStorageRequest: 20Gi
  runnerEphemeralStorageLimit: 40Gi

  # Workspace configuration — controls how runner and task pods share a
  # filesystem. Set mode to "pvc" to create per-run PVCs for shared workspace.
  workspace:
    mode: "emptydir"      # "emptydir" or "pvc"
    accessMode: "RWX"     # "RWX" or "RWO" (only used when mode is "pvc")
    storageClass: ""      # optional; empty uses cluster default
    size: "10Gi"          # PVC size (only used when mode is "pvc")

  # Optional per-version runner image overrides keyed by resolved Nextflow
  # version, e.g. {"25.04.3": "harbor.../conquest-nf-25.04.3-runner:release-20260329"}.
  nextflowRunnerImages: {}

  # Optional per-version WDL runner image overrides keyed by resolved
  # miniwdl version, e.g. {"1.12.1": "harbor.../conquest-wdl-runner:release-20260329"}.
  wdlRunnerImages: {}

  # External WDL imports are disabled in v1 by default. Set to true only if
  # the deployment is prepared to rely on network-resolved imports.
  wdlAllowExternalImports: false

  # Optional per-version Snakemake runner/task image overrides keyed by resolved
  # Snakemake version, e.g. {"7.32.4": "harbor.../conquest-smk-7.32.4-runner:release-20260329"}.
  # The default snakemakeRunnerImage/snakemakeTaskImage above is used for the
  # platform default version (9.17.3). Non-default versions must have an entry here.
  snakemakeRunnerImages: {}
  snakemakeTaskImages: {}

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Override only if runner Jobs must call the API through a non-standard
  # in-cluster address. The chart otherwise derives the service DNS name.
  internalBaseURLOverride: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  replicaCount: 1

  env:
    CONQUEST_HTTP_ADDR: ":8080"
    CONQUEST_S3_BUCKET: "conquest"
    CONQUEST_S3_ENDPOINT: "http://minio.platform.svc.cluster.local:9000"
    CONQUEST_S3_REGION: "us-east-1"
    CONQUEST_K8S_NAMESPACE: "services"
    CONQUEST_LAYOUT_VERSION: "v1"
    CONQUEST_SERVICE_ACCOUNT: "conquest"
    # CONQUEST_IMAGE is set automatically from the deployment image in the template.
    # Runner image for Nextflow execution Jobs.
    # CONQUEST_RUNNER_IMAGE is set automatically in the template.
    # Optional version-specific Nextflow runner image overrides are injected via
    # CONQUEST_NEXTFLOW_RUNNER_IMAGES when conquest.nextflowRunnerImages is non-empty.
    # CONQUEST_WDL_RUNNER_IMAGE is set automatically in the template.
    # CONQUEST_SNAKEMAKE_RUNNER_IMAGE and CONQUEST_SNAKEMAKE_TASK_IMAGE are set
    # automatically in the template when configured.

  serviceAccount:
    create: true
    name: conquest

  migration:
    image:
      repository: migrate/migrate
      tag: v4.17.0
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "$(DATABASE_URL)"
      - "up"

# Secrets references — matches manually created resources in the cluster.
secrets:
  postgres:
    name: conquest-db-secret
  storage:
    name: storage-secrets

global:
  imagePullSecrets:
    - harbor
