conquest:
  appname: conquest

  # Every Conquest image below is pinned to the same commit. CI publishes
  # sha-<commit> for all of them on each push to master; bump them together.
  image:
    repository: docker.io/anurag1201/conquest
    tag: sha-d618619
    pullPolicy: Always

  runnerImage:
    repository: docker.io/anurag1201/conquest-nf-24.10.4-runner
    tag: sha-d618619

  wdlRunnerImage:
    repository: docker.io/anurag1201/conquest-wdl-runner
    tag: sha-d618619

  snakemakeRunnerImage:
    repository: docker.io/anurag1201/conquest-smk-9.17.3-runner
    tag: sha-d618619

  snakemakeTaskImage:
    repository: docker.io/anurag1201/conquest-smk-9.17.3-runner
    tag: sha-d618619

  snakemakeDefaultJobs: 32
  snakemakeDefaultDiskMB: 8192
  runnerEphemeralStorageRequest: 20Gi
  runnerEphemeralStorageLimit: 40Gi

  # Workspace configuration — controls how runner and task pods share a
  # filesystem. Set mode to "pvc" for per-run PVCs, or "objectfs" for
  # S3-mounted per-run volumes via the Yandex S3 CSI driver + GeeseFS.
  workspace:
    mode: "emptydir"      # "emptydir", "pvc", or "objectfs"
    accessMode: "RWX"     # "RWX" or "RWO" (only used when mode is "pvc")
    storageClass: ""      # optional; empty uses cluster default (pvc only)
    size: "10Gi"          # volume size (used for pvc and objectfs)

  # Pod security for the runner and task pods Conquest creates. "restricted"
  # satisfies the restricted Pod Security Standard: every container runs as
  # runAsUser/runAsGroup with seccomp RuntimeDefault, no privilege escalation
  # and all capabilities dropped. Executor images run as that UID rather than
  # their own USER. "baseline" lets executor images run as the user they
  # declare, which is often root.
  podSecurity:
    profile: "restricted"  # "restricted" or "baseline"
    runAsUser: 1000
    runAsGroup: 1000       # also used as the pod fsGroup

  # Optional per-version runner image overrides keyed by resolved Nextflow
  # version, e.g. {"25.04.3": "docker.io/anurag1201/conquest-nf-25.04.3-runner:v1.0.0"}.
  nextflowRunnerImages:
    "25.04.3": docker.io/anurag1201/conquest-nf-25.04.3-runner:sha-d618619
    "25.10.2": docker.io/anurag1201/conquest-nf-25.10.2-runner:sha-d618619
    "25.10.4": docker.io/anurag1201/conquest-nf-25.10.4-runner:sha-d618619

  # Optional per-version WDL runner image overrides keyed by resolved
  # miniwdl version, e.g. {"1.12.1": "docker.io/anurag1201/conquest-wdl-runner:v1.0.0"}.
  wdlRunnerImages: {}

  # External WDL imports are disabled in v1 by default. Set to true only if
  # the deployment is prepared to rely on network-resolved imports.
  wdlAllowExternalImports: false

  # Optional per-version Snakemake runner/task image overrides keyed by resolved
  # Snakemake version, e.g. {"7.32.4": "docker.io/anurag1201/conquest-smk-7.32.4-runner:v1.0.0"}.
  # The default snakemakeRunnerImage/snakemakeTaskImage above is used for the
  # platform default version (9.17.3). Non-default versions must have an entry here.
  snakemakeRunnerImages:
    "7.32.4": docker.io/anurag1201/conquest-smk-7.32.4-runner:sha-d618619
  snakemakeTaskImages:
    "7.32.4": docker.io/anurag1201/conquest-smk-7.32.4-runner:sha-d618619

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Override only if runner Jobs must call the API through a non-standard
  # in-cluster address. The chart otherwise derives the service DNS name.
  internalBaseURLOverride: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  replicaCount: 1

  env:
    CONQUEST_HTTP_ADDR: ":8080"
    CONQUEST_S3_BUCKET: "conquest"
    CONQUEST_S3_ENDPOINT: "http://minio.platform.svc.cluster.local:9000"
    CONQUEST_S3_REGION: "us-east-1"
    CONQUEST_LAYOUT_VERSION: "v1"
    CONQUEST_SERVICE_ACCOUNT: "conquest"
    # CONQUEST_K8S_NAMESPACE defaults to the release namespace, where the chart's
    # Role is bound. Set it here only to create Jobs somewhere else.
    # CONQUEST_IMAGE is set automatically from the deployment image in the template.
    # Runner image for Nextflow execution Jobs.
    # CONQUEST_RUNNER_IMAGE is set automatically in the template.
    # Optional version-specific Nextflow runner image overrides are injected via
    # CONQUEST_NEXTFLOW_RUNNER_IMAGES when conquest.nextflowRunnerImages is non-empty.
    # CONQUEST_WDL_RUNNER_IMAGE is set automatically in the template.
    # CONQUEST_SNAKEMAKE_RUNNER_IMAGE and CONQUEST_SNAKEMAKE_TASK_IMAGE are set
    # automatically in the template when configured.

  serviceAccount:
    create: true
    name: conquest

  migration:
    image:
      repository: migrate/migrate
      tag: v4.17.0
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "$(DATABASE_URL)"
      - "up"

# Secrets references — matches manually created resources in the cluster.
secrets:
  postgres:
    name: conquest-db-secret
  storage:
    name: storage-secrets

# ObjectFS workspace — S3-mounted volumes via Yandex S3 CSI driver + GeeseFS.
# When enabled, installs the CSI driver components and grants Conquest
# cluster-scoped permissions for static PV management.
objectfs:
  enabled: false
  # Install CSI driver components (namespace, DaemonSet, provisioner).
  # Set to false if the CSI driver is already installed externally.
  installCSI: true
  namespace: conquest-objectfs
  # CSI driver images.
  csiS3Image: cr.yandex/crp9ftr22d26age3hulg/csi-s3:0.43.6
  csiProvisionerImage: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-provisioner:v6.2.0
  csiRegistrarImage: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-node-driver-registrar:v2.16.0
  # GeeseFS mount options (Talos-safe defaults).
  geesefs:
    memoryLimitMb: 1000
    options: "--no-systemd --dir-mode 0777 --file-mode 0666"

global:
  # All published images are public on Docker Hub, so no pull secret is needed.
  # Add entries here only when mirroring into a private registry.
  imagePullSecrets: []
