{{- if .Values.objectfs.enabled }}
---
# CSI-compatible secret in the Conquest namespace, referenced by static PVs.
# The Yandex S3 CSI driver expects keys: accessKeyID, secretAccessKey, endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: csi-s3-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $storageSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.storage.name) }}
  {{- if $storageSecret }}
  accessKeyID: {{ index $storageSecret.data "AWS_ACCESS_KEY_ID" }}
  secretAccessKey: {{ index $storageSecret.data "AWS_SECRET_ACCESS_KEY" }}
  {{- else }}
  accessKeyID: ""
  secretAccessKey: ""
  {{- end }}
stringData:
  endpoint: {{ .Values.conquest.env.CONQUEST_S3_ENDPOINT | default "http://minio.platform.svc.cluster.local:9000" | quote }}
{{- end }}
