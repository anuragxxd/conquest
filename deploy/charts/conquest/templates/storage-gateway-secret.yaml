{{- if and .Values.storageGateway.enabled (not .Values.storageGateway.existingSecret) }}
{{- $name := printf "%s-storage-gateway" (include "conquest.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Signs storage gateway URLs. Generated once and kept across upgrades;
# rotating it invalidates the URLs of tasks in flight.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ .Values.conquest.appname }}
type: Opaque
data:
  {{- if $existing }}
  secret: {{ index $existing.data "secret" }}
  {{- else }}
  secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
