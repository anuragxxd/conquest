apiVersion: v1
kind: Service
metadata:
  name: {{ include "conquest.fullname" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
spec:
  type: {{ .Values.conquest.service.type }}
  ports:
    - port: {{ .Values.conquest.service.port }}
      targetPort: {{ .Values.conquest.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "conquest.selectorLabels" . | nindent 4 }}
