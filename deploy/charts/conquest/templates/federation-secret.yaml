{{- if .Values.federation.enabled }}
# Remote TES endpoints and routing rules (internal/backend/routing). A
# Secret, not a ConfigMap: endpoint URLs and headers can be sensitive.
# Credentials themselves never go here; see federation.credentialsSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conquest.fullname" . }}-federation
  labels:
    app: {{ .Values.conquest.appname }}
type: Opaque
stringData:
  config.yaml: |
{{ toYaml .Values.federation.config | indent 4 }}
{{- end }}
